<!doctype html>
<html lang="pt-BR", xmlns:th="https://thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Fundo suave e centralização */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f0f4ff 0%, #e6fff7 100%);
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        }

        .card-login {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(33, 47, 77, 0.12);
            overflow: hidden;
        }

        .brand-bar {
            height: 92px;
            background: linear-gradient(90deg, #4f46e5, #06b6d4);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .form-body {
            padding: 28px;
        }

        .btn-primary {
            background: linear-gradient(90deg, #4f46e5, #06b6d4);
            border: none;
        }

        .text-muted-small {
            font-size: 0.9rem;
            color: #6b7280;
        }
    </style>
</head>
<body>

<main class="container">
    <div class="card card-login mx-auto">
        <div class="brand-bar">Minha Aplicação</div>
        <div class="form-body">
            <h5 class="mb-3">Entrar na sua conta</h5>

            <form id="loginForm" action="#" method="post" novalidate th:action="@{login}">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuário</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="seu.usuario" required>
                    <div class="invalid-feedback">
                        Por favor, informe o usuário.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                    <div class="invalid-feedback">
                        Por favor, informe a senha.
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="remember" name="remember">
                        <label class="form-check-label" for="remember">Lembrar-me</label>
                    </div>
                    <a href="#" class="text-decoration-none small">Esqueceu a senha?</a>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
                </div>

                <p class="text-center text-muted-small mb-0">
                    Não tem conta? <a href="#">Cadastre-se</a>
                </p>
            </form>
        </div>
    </div>
</main>

<!-- Bootstrap 5 JS (opcional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Validação simples com Bootstrap
    (function () {
        'use strict'
        const form = document.getElementById('loginForm');

        form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            } else {
                // aqui você pode adicionar lógica antes de enviar, ex: desabilitar botão
                // event.preventDefault(); // remover se quiser realmente submeter
            }
            form.classList.add('was-validated');
        }, false)
    })();
</script>

</body>
</html>
